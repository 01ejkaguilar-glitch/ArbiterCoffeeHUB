name: Deploy Laravel Application to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, bcmath, xml
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Sanitize SSH variables
        id: sanitize
        run: |
          echo "SSH_USERNAME=$(echo '${{ secrets.SSH_USERNAME }}' | xargs)" >> $GITHUB_ENV
          echo "SSH_HOST=$(echo '${{ secrets.SSH_HOST }}' | xargs)" >> $GITHUB_ENV
          echo "SSH_PORT=$(echo '${{ secrets.SSH_PORT }}' | xargs)" >> $GITHUB_ENV
          # Note: SSH_PRIVATE_KEY we keep as is; we will trim newlines when using

      - name: Build React frontend
        run: |
          cd frontend
          # Ensure package-lock.json exists for npm ci
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json not found, generating with npm install..."
            npm install --legacy-peer-deps
          fi
          npm ci --legacy-peer-deps
          npm run build

      - name: Validate environment
        run: |
          echo "Validating environment files..."
          if [ ! -f .env ]; then
            echo "Error: .env file not found in repository"
            exit 1
          fi
          if [ ! -s .env ]; then
            echo "Error: .env file is empty"
            exit 1
          fi
          echo ".env file exists and is not empty"

          # Check for required variables
          if ! grep -q "^APP_KEY=" .env; then
            echo "Warning: APP_KEY not set in .env, will generate during deployment"
          fi

      - name: Set up SSH connection
        run: |
          mkdir -p ~/.ssh
          # Trim whitespace from private key (important for newlines)
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Add Hostinger host to known hosts
          ssh-keyscan -p ${SSH_PORT} ${SSH_HOST} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          echo "Testing SSH connection to ${SSH_HOST}..."
          if ! ssh -p ${SSH_PORT} -o BatchMode=yes -o ConnectTimeout=10 ${SSH_USERNAME}@${SSH_HOST} 'echo "SSH connection test successful"'; then
            echo "SSH connection test failed"
            exit 1
          fi
          echo "SSH connection test passed"

      - name: Create deployment archive
        run: |
          echo "Creating deployment archive..."
          # Create a clean deployment directory
          rm -rf deploy_temp
          mkdir -p deploy_temp

          # Copy all necessary files (excluding the deploy_temp directory itself)
          find . -maxdepth 1 -mindepth 1 ! -name 'deploy_temp' ! -name '.git' ! -name '.github' ! -name 'node_modules' ! -name 'frontend/node_modules' ! -name 'frontend/.cache' -exec cp -r {} deploy_temp/ \;

          # Create tarball
          tar -czf deployment.tar.gz -C deploy_temp .

          # Cleanup
          rm -rf deploy_temp

          echo "Deployment archive created successfully"

      - name: Deploy application
        run: |
          echo "Uploading deployment archive..."
          scp -P ${SSH_PORT} -o StrictHostKeyChecking=no deployment.tar.gz ${SSH_USERNAME}@${SSH_HOST}:/tmp/

          echo "Extracting and deploying application..."
          ssh -p ${SSH_PORT} -o StrictHostKeyChecking=no ${SSH_USERNAME}@${SSH_HOST} "
            set -e
            echo 'Starting deployment process...'

            # Create target directory
            TARGET_DIR='/home/${SSH_USERNAME}/domains/arbitercoffeeshop.com/public_html'
            mkdir -p \"$TARGET_DIR\"

            # Extract archive
            echo 'Extracting archive...'
            tar -xzf /tmp/deployment.tar.gz -C \"$TARGET_DIR\"
            rm /tmp/deployment.tar.gz

            # Set permissions
            echo 'Setting permissions...'
            find \"$TARGET_DIR\" -type f -exec chmod 644 {} \;
            find \"$TARGET_DIR\" -type d -exec chmod 755 {} \;

            # Ensure storage and bootstrap/cache directories are writable
            chmod -R 775 \"$TARGET_DIR/storage\" \"$TARGET_DIR/bootstrap/cache\"

            # Try to set ownership if possible (ignore if not permitted)
            chown -R ${SSH_USERNAME}:${SSH_USERNAME} \"$TARGET_DIR/storage\" \"$TARGET_DIR/bootstrap/cache\" 2>/dev/null || echo 'Warning: Could not set ownership on storage/cache, continuing...'

            # Ensure .env file exists and has correct permissions
            if [ ! -f \"$TARGET_DIR/.env\" ]; then
              echo 'Error: .env file not found after extraction!'
              exit 1
            fi
            chmod 644 \"$TARGET_DIR/.env\" || echo 'Warning: Could not set .env permissions'

            # Navigate to project directory
            cd \"$TARGET_DIR\"

            # Clear and cache configuration
            echo 'Clearing caches...'
            php artisan optimize:clear --no-interaction

            echo 'Caching configuration...'
            php artisan config:cache --no-interaction

            echo 'Caching routes...'
            php artisan route:cache --no-interaction

            echo 'Caching views...'
            php artisan view:cache --no-interaction

            # Run migrations
            echo 'Running database migrations...'
            php artisan migrate --force --no-interaction

            # Run seeders
            echo 'Running database seeders...'
            php artisan db:seed --force --no-interaction

            echo 'Deployment completed successfully!'
          " || {
            echo 'Deployment failed during remote execution'
            exit 1
          }

          echo "Deploy completed successfully"

      - name: Cleanup
        if: always()
        run: |
          rm -f deployment.tar.gz