name: Deploy to Hostinger

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, xml
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache-dependency-path: 'frontend/package-lock.json'
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          composer install --prefer-dist --optimize-autoloader
          cd frontend && npm install --legacy-peer-deps && npm run build

      - name: Debug SSH secret length
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "SSH private key secret length (asterisks count): ${#SSH_PRIVATE_KEY}"
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Error: SSH_PRIVATE_KEY secret is empty or not set"
            exit 1
          fi

      - name: Setup SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Validate key is loadable by OpenSSH (catches formatting errors early)
          if ! ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null 2>&1; then
            echo "Error: Invalid SSH private key format in secret"
            # Optionally output first and last few chars for debugging (masked)
            echo "First 10 chars: ${SSH_PRIVATE_KEY:0:10}"
            echo "Last 10 chars: ${SSH_PRIVATE_KEY: -10}"
            exit 1
          fi

      - name: Debug SSH connection details
        run: |
          echo "SSH_HOST: $SSH_HOST"
          echo "SSH_PORT: $SSH_PORT"
          echo "SSH_USERNAME: $SSH_USERNAME"

      - name: Test SSH connection
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 -p $SSH_PORT $SSH_USERNAME@$SSH_HOST echo "SSH connection successful"

      - name: Deploy via Rsync (Incremental)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Deploy Laravel backend (only changed files)
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa -p $SSH_PORT -o StrictHostKeyChecking=no" \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='frontend/' \
            --exclude='frontend/node_modules' \
            --exclude='frontend/.cache' \
            ./ \
            $SSH_USERNAME@$SSH_HOST:/home/$SSH_USERNAME/domains/arbitercoffeeshop.com/public_html/api/

          # Deploy React frontend build (only changed files)
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa -p $SSH_PORT -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='api/' \
            frontend/build/ \
            $SSH_USERNAME@$SSH_HOST:/home/$SSH_USERNAME/domains/arbitercoffeeshop.com/public_html/

      - name: Verify deployment directory
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "Checking deployed files..."
          ssh -i ~/.ssh/id_rsa -p $SSH_PORT -o StrictHostKeyChecking=no $SSH_USERNAME@$SSH_HOST "
            ls -la /home/$SSH_USERNAME/domains/arbitercoffeeshop.com/public_html/
            ls -la /home/$SSH_USERNAME/domains/arbitercoffeeshop.com/public_html/api/
          "

      - name: Run Post-Deployment Commands via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          ssh -i ~/.ssh/id_rsa -p $SSH_PORT -o StrictHostKeyChecking=no $SSH_USERNAME@$SSH_HOST "
            cd /home/$SSH_USERNAME/domains/arbitercoffeeshop.com/public_html/api &&
            php artisan config:cache &&
            php artisan route:cache &&
            php artisan view:cache &&
            php artisan optimize:clear &&
            echo 'Deployment completed successfully'
          "