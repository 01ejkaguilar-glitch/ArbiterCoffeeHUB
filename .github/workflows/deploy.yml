name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Deployment action'
        required: true
        default: 'deploy'
        type: choice
        options: [deploy, rollback]
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options: [staging, production]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      # ===== SETUP PHASE =====
      - name: Checkout code
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: "24" }

      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, pdo_mysql, bcmath, zip, gd
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      # ===== BUILD & TEST PHASE =====
      - name: Install frontend dependencies
        run: cd frontend && npm ci --legacy-peer-deps

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Test frontend (continue on deployment even if tests fail - known issue with ImageSnapshot)
        run: cd frontend && npm test -- --watchAll=false --ci
        continue-on-error: true

      - name: Install backend dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-dev

      # ===== DEPLOYMENT PHASE =====
      - name: Prepare deployment directory
        run: |
          rm -rf public_html
          mkdir -p public_html/api/{storage/{logs,framework/{cache,sessions,views},bootstrap/cache},api}
          mkdir -p public_html/bootstrap/cache

      - name: Deploy frontend
        run: cp -r frontend/build/* public_html/

      - name: Deploy backend files
        run: |
          cp -r public index.php artisan composer.json composer.lock .env public_html/api/ 2>/dev/null || true
          cp -r app config routes bootstrap storage database resources public_html/api/
          cp -r public/.htaccess lang public_html/api/ 2>/dev/null || true

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./public_html/
          exclude: |
            **/vendor/**
            **/.git/**
            **/.ftp-deploy-sync-state.json

      # ===== POST-DEPLOYMENT (Laravel) =====
      - name: Run Laravel setup commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Set paths
            BASE_DIR="/home/u843463747/domains/arbitercoffee.shop"
            RELEASE_TIMESTAMP=$(date +%Y%m%d%H%M%S)
            RELEASE_DIR="$BASE_DIR/releases/$RELEASE_TIMESTAMP"
            CURRENT_LINK="$BASE_DIR/current"

            # Create release directory and deploy
            mkdir -p "$RELEASE_DIR"
            cp -r "$BASE_DIR/public_html/"* "$RELEASE_DIR/"

            # Update symlink for zero-downtime deploy
            ln -snf "$RELEASE_DIR" "$CURRENT_LINK"

            # Laravel optimization commands
            cd "$RELEASE_DIR"
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            chmod -R 755 storage bootstrap/cache

            echo "✅ Deployment complete: $RELEASE_TIMESTAMP"

      # ===== CLEANUP & NOTIFICATIONS =====
      - name: Clean old releases (keep 5)
        if: github.event.inputs.action == 'deploy'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            BASE_DIR="/home/u843463747/domains/arbitercoffee.shop"
            cd "$BASE_DIR/releases"
            ls -dt */ | tail -n +6 | xargs rm -rf --

      - name: Create production tag
        if: github.event.inputs.action == 'deploy' && github.event.inputs.environment == 'production' && github.ref == 'refs/heads/main'
        run: |
          git tag "release-$(date +%Y%m%d%H%M%S)"
          git push origin "--tags"

      - name: Deployment notification
        if: always()
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: |
            {
              "text": "Deployment ${{ github.job }}: ${{ job.status }}",
              "blocks": [
                { "type": "header", "text": { "type": "plain_text", "text": ":rocket: Deployment Status" } },
                { "type": "section", "fields": [
                  { "type": "mrkdwn", "text": "*Workflow:*\n${{ github.workflow }}" },
                  { "type": "mrkdwn", "text": "*Status:*\n${{ job.status }}" },
                  { "type": "mrkdwn", "text": "*Environment:*\n${{ github.event.inputs.environment }}" },
                  { "type": "mrkdwn", "text": "*Commit:*\n${{ github.sha:0:7 }}" }
                ] }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
